[project]
name = "ncie-foundation-service"
version = "0.0.0"
description = "NCIE WBS-15 local foundation service"
readme = "README.md"
dependencies = []

[project.optional-dependencies]
development = [
    "mypy==2.3.1",
    "ruff==0.16.8",
]

[tool.mypy]
strict = true
python_version = "3.14"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]

[tool.ncie]
work-package = "WBS-15-WP-001"
work-packages = ["WBS-15-WP-001", "WBS-15-WP-002", "WBS-15-WP-003", "WBS-15-WP-004", "WBS-15-WP-005"]
security-work-packages = ["WBS-16-WP-001", "WBS-16-WP-002", "WBS-16-WP-003", "WBS-16-WP-004", "WBS-16-WP-005"]
decision-evidence = "NCIE-WBS15-OWNER-DECISION-2026-09-17-001"
latest-decision-evidence = "NCIE-WBS16-OWNER-DECISION-2026-09-23-022"
production-authorized = false
acceptance-status = "PENDING"
